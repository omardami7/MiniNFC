name: Build APK

# Compile l'APK à chaque push, et quand tu le lances à la main.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier une "Release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Les runners ubuntu-latest ont déjà le SDK Android préinstallé.
      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Compiler l'APK de debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Artefact classique (téléchargeable depuis l'onglet Actions, format zip)
      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: MiniNFC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Release : donne un lien de téléchargement DIRECT du .apk (ouvrable sur mobile)
      - name: Publier l'APK en téléchargement direct (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernier APK
          body: "APK de debug de Mini NFC. Télécharge app-debug.apk ci-dessous."
          files: app/build/outputs/apk/debug/app-debug.apk
