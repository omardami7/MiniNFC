name: Build APK

# Compile l'APK à chaque push, et quand tu le lances à la main.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Compiler l'APK de debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: MiniNFC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
